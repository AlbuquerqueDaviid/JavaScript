<body>
    <main>
        <h1>Checkup de dados </h1>
        Nacionalidade: <input type="text" name="pais" id="pais">
        <input type="button" value="Send" onclick="checar()">
    </main>
    <div id="nac">

    </div>
    
    <script>
        function checar(){
            var pais = window.document.querySelector('main#pais')
            var nac = window.document.checar()

            if (nac == Brasil){
            nac.innerHTML = `Você Não é estrangeiro Bem Vindo de volta!`
            }
            else (nac != Brasil) {
            nac.innerHTML = `Você é estrangeiro, Bem vindo ao Brasil!`
            }
            
        }
    </script>
