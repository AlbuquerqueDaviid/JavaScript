<body>
    <h1>Olá</h1>
    <script>
       
       var n1 = Number(window.prompt('Digite um número: ')) // convertendo string para número inteiro
       var n2 = Number.parseFloat(window.prompt('Digite outro número: ')) // convertendo string para número real
       var s = n1 + n2 
       window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) // usando template string
       
       // o comando window.prompt retorna os dados como string, necessário converter a string para number, para funcionar. ultilizando os comandos:   Number.parseInt() para números inteiros 1 2 3... ou Number.parseFloat() para números reais, com virgula etc
    
       // também posso ultilizar só Number(), mas em casos específicos ainda pode ser necessário usar os parseInt ou Float. 

       // para converter de number para string com os comandos String() ou n.toString()
       
       // podendo ultilizar 3 formas de formatação de strings, sem interpolação (simples) com concatenação ('Eu estou aprendendo ' + dado/var) ou com templates (`Eu estou aprendendo ${dado/var}`)
        
       
    </script>
</body>
