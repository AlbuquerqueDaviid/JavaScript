<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comandos Extras da aula</title>
</head>
<style>
    body {
        font: normal 20pt arial;
    }
</style>
<body>
    <script>
        var nome = window.prompt('qual é seu nome?')
        document.write(`Olá <strong>${nome}</strong> !, seu nome tem ${nome.length} letras.<br>`)
        document.write(`Seu nome em maiúsculas é ${nome.toUpperCase()}<br>`)
        document.write(`Seu nome em minúsculas é ${nome.toLowerCase()}`)

        //comandos extras toUpperCase() altera as letras para maiúscula o toLowerCase() altera para minúscula enquanto o comando .length() mostra a quantidades de caracteres na string.

        // toFixed(2) mostra as casas decimais, por exemplo 2.5 mostraria 2.50 adicionando o zero da casa decimal. na formatação guanabara transforma o ponto em vírgula usando o comando n1.toFixed(2).replace('.' , ',')

        //adicionando o comando para transformar números em valores com cifrões, .toLocaleString('pt-BR', {style:'currency', currency:'BRL'})
        
    </script>
    
</body>
</html>
